<html lang="ja">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<title>筋トレ用 ヒーローソング えらび</title>
<style>
:root{--bg:#0a0f1a;--bg2:#0f1828;--card:#131e31;--line:#24324a;--line2:#2f4060;--text:#c9d3e2;--sub:#8a98ae;--blue:#3d5a85;--gold:#c9a46a;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 48px}
header{padding:18px 0 6px}
h1{font-size:1.25rem;margin:0 0 4px;font-weight:700;color:#dbe3ef}
.lead{color:var(--sub);font-size:.9rem;margin:0}
.bar{position:sticky;top:0;z-index:20;background:rgba(10,15,26,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -12px;padding:8px 12px calc(8px)}
.barrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.total{font-size:.85rem;color:var(--sub);flex:1;min-width:120px}
.total b{color:var(--gold);font-weight:700}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filters button{flex:1 0 auto}
button{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
.filters button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.btn-gold{border-color:var(--gold);color:var(--gold);font-weight:700}
.btn-copy{font-size:1.15rem;padding:12px 18px;min-height:52px;width:100%;border:2px solid var(--gold);color:var(--bg);background:var(--gold);font-weight:700;border-radius:12px}
.btn-small{font-size:.85rem;min-height:36px;padding:6px 10px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.panel h2{font-size:1rem;margin:0 0 8px}
textarea#out{width:100%;min-height:170px;max-height:45vh;resize:vertical;background:#070b13;color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:10px;font:15px/1.6 ui-monospace,"SF Mono",Menlo,monospace,"Hiragino Sans";white-space:pre}
.row2{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.row2 .btn-copy{flex:1}
.msg{min-height:1.4em;font-size:.88rem;color:var(--gold);margin-top:6px}
section.series{margin-top:22px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.shead h2{font-size:1.1rem;margin:0;color:#dbe3ef}
.count{font-size:.82rem;color:var(--sub)}
.count b{color:var(--gold)}
.note{font-size:.85rem;color:var(--sub);margin:8px 0 10px}
.sub{font-size:.95rem;margin:18px 0 4px;color:#b9c5d8;border-left:3px solid var(--blue);padding-left:8px}
.list{display:grid;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;transition:border-color .15s,opacity .15s}
.card .no{font-size:.75rem;color:var(--sub)}
.card .title{font-weight:700;font-size:1rem;word-break:break-word;color:#dbe3ef}
.card .yr{font-size:.85rem;color:var(--sub)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:.7rem;border:1px solid var(--line2);color:var(--sub);background:transparent;border-radius:999px;padding:1px 8px}
.tag.on{border-color:var(--gold);color:var(--gold)}
.acts{display:flex;flex-direction:column;gap:6px}
.acts button{min-width:72px;min-height:38px;padding:6px 10px;font-size:.9rem}
.card.yes{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.card.yes .b-yes{border-color:var(--gold);background:var(--gold);color:var(--bg);font-weight:700}
.card.no-c{opacity:.55}
.card.no-c .title{text-decoration:line-through;text-decoration-color:var(--sub)}
.card.no-c .b-no{border-color:var(--sub);background:#25324a;color:#dbe3ef;font-weight:700}
.state{font-size:.75rem;margin-top:4px}
.card.yes .state{color:var(--gold)}
.card.no-c .state{color:var(--sub)}
.hide{display:none!important}
.empty{color:var(--sub);font-size:.88rem;padding:6px 2px}
footer{color:var(--sub);font-size:.78rem;margin-top:32px;border-top:1px solid var(--line);padding-top:10px}
a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>筋トレ用 ヒーローソング えらび</h1>
<p class="lead">トレーニングで聴きたい曲の番組を「採用」、いらないものを「却下」。えらんだものは下のリストに自動でまとまるので、「コピー」でそのまま使えます。</p>
</header>

<div class="bar" id="bar">
  <div class="barrow">
    <div class="total" id="total"></div>
    <button class="btn-gold btn-small" id="copyTop" type="button">コピー</button>
    <button class="btn-small" id="jump" type="button">リストを見る</button>
  </div>
  <div class="filters" role="group" aria-label="しぼりこみ">
    <button type="button" data-f="all" aria-pressed="true">すべて</button>
    <button type="button" data-f="yes" aria-pressed="false">採用</button>
    <button type="button" data-f="no" aria-pressed="false">却下</button>
    <button type="button" data-f="none" aria-pressed="false">未選択</button>
  </div>
</div>

<div class="panel" id="outPanel">
  <h2>採用リスト（コピー用）</h2>
  <textarea id="out" readonly aria-label="採用した番組のリスト"></textarea>
  <div class="row2">
    <button class="btn-copy" id="copy" type="button">コピー</button>
    <button id="reset" type="button">リセット</button>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
</div>

<main id="main"></main>

<footer>
  作品名と放送年は日本語版ウィキペディアの一覧ページ（仮面ライダーシリーズ／スーパー戦隊シリーズ／メタルヒーローシリーズ／PROJECT R.E.D.）で確かめました（2026年10月時点）。えらんだ結果はこの端末のブラウザの中だけに保存されます。
</footer>
</div>

  l.appendChild(el("div","title",it.t));
  l.appendChild(el("div","yr",(/–$/.test(it.y)?it.y.replace(/–$/,"")+"年〜（放送中）":it.y+"年")));
  if(it.tags.length){var tg=el("div","tags");it.tags.forEach(function(t){tg.appendChild(el("span","tag"+(t==="放送中"?" on":""),t))});l.appendChild(tg)}
  l.appendChild(el("div","state"));
  var a=el("div","acts");
  var by=el("button","b-yes","採用");by.type="button";
  var bn=el("button","b-no","却下");bn.type="button";
  by.onclick=function(){toggle(it.id,"yes")};bn.onclick=function(){toggle(it.id,"no")};
  a.appendChild(by);a.appendChild(bn);
  c.appendChild(l);c.appendChild(a);cards[it.id]={el:c,by:by,bn:bn};
  return c;
}
DATA.forEach(function(s){
  var sec=el("section","series");sec.id="sec-"+s.key;
  var h=el("div","shead");h.appendChild(el("h2",null,s.name));
  var cnt=el("div","count");cnt.id="cnt-"+s.key;h.appendChild(cnt);sec.appendChild(h);
  sec.appendChild(el("p","note",s.note));
  var list=el("div","list");s.items.forEach(function(it){list.appendChild(card(it))});sec.appendChild(list);
  sec.appendChild(el("div","empty hide",""));
  if(s.extra){sec.appendChild(el("h3","sub",s.extra.title));var l2=el("div","list");s.extra.items.forEach(function(it){l2.appendChild(card(it))});sec.appendChild(l2)}
  main.appendChild(sec);
});
function toggle(id,v){if(st[id]===v)delete st[id];else st[id]=v;save();render()}
function text(){
  var out=[];
  DATA.forEach(function(s){
    var y=s.items.filter(function(i){return st[i.id]==="yes"}).map(function(i){return i.t+"（"+i.y+"）"});
    var y2=s.extra?s.extra.items.filter(function(i){return st[i.id]==="yes"}).map(function(i){return i.t+"（"+i.y+"）※PROJECT R.E.D."}):[];
    var all=y.concat(y2);
    if(all.length){if(out.length)out.push("");out.push("【"+s.name+"】");out=out.concat(all)}
  });
  return out.join("\n");
}
function render(){
  var ty=0,tn=0,tt=0;
  DATA.forEach(function(s){
    var items=allItems(s),y=0,n=0,shown=0;
    items.forEach(function(it){
      var v=st[it.id],c=cards[it.id];
      c.el.classList.toggle("yes",v==="yes");c.el.classList.toggle("no-c",v==="no");
      c.by.setAttribute("aria-pressed",v==="yes");c.bn.setAttribute("aria-pressed",v==="no");
      c.el.querySelector(".state").textContent=v==="yes"?"✓ 採用":v==="no"?"× 却下":"";
      var show=filter==="all"||(filter==="yes"&&v==="yes")||(filter==="no"&&v==="no")||(filter==="none"&&!v);
      c.el.classList.toggle("hide",!show);if(show)shown++;
      if(v==="yes")y++;else if(v==="no")n++;
    });
    ty+=y;tn+=n;tt+=items.length;
    document.getElementById("cnt-"+s.key).innerHTML="採用 <b>"+y+"</b> ／ 却下 "+n+" ／ 未選択 "+(items.length-y-n)+" ／ 全"+items.length;
    var em=document.querySelector("#sec-"+s.key+" .empty");em.textContent=shown?"":"この条件に合う番組はありません。";em.classList.toggle("hide",!!shown);
    document.querySelectorAll("#sec-"+s.key+" .sub").forEach(function(h){var l=h.nextElementSibling;var any=[].some.call(l.children,function(c){return !c.classList.contains("hide")});h.classList.toggle("hide",!any)});
  });
  document.getElementById("total").innerHTML="採用 <b>"+ty+"</b> ／ 却下 "+tn+" ／ 全"+tt;
  var t=text();document.getElementById("out").value=t||"（まだ採用した番組はありません）";
}
var msg=document.getElementById("msg");var mt;
function say(s){msg.textContent=s;clearTimeout(mt);mt=setTimeout(function(){msg.textContent=""},2500)}
function fallback(t){
  var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.left="0";ta.style.opacity="0";ta.style.fontSize="16px";
  document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);return ok;
}
function copy(){
  var t=text();if(!t){say("まだ採用した番組がありません。");return}
  function done(){say("コピーしました！（"+t.split("\n").filter(function(l){return l&&l[0]!=="【"}).length+"件）")}
  function fb(){if(fallback(t))done();else{var o=document.getElementById("out");o.focus();o.select();say("自動でコピーできませんでした。リストを長押ししてコピーしてね。")}}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb();
}
document.getElementById("copy").onclick=copy;
document.getElementById("copyTop").onclick=copy;
document.getElementById("jump").onclick=function(){document.getElementById("outPanel").scrollIntoView({behavior:"smooth",block:"start"})};
document.getElementById("reset").onclick=function(){
  if(confirm("採用・却下をぜんぶ消して、最初の状態にもどしますか？")){st={};save();render();say("リセットしました。")}
};
document.querySelectorAll(".filters button").forEach(function(b){b.onclick=function(){filter=b.dataset.f;document.querySelectorAll(".filters button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});render()}});
render();
})();
</script>
</body>
</html>
